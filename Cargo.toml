[workspace]
resolver = "2"
members = ["crates/php-scanner-core", "crates/php-scanner-cli", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/php-scanner/php-scanner"
rust-version = "1.80"

[workspace.dependencies]
php-scanner-core = { path = "crates/php-scanner-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
